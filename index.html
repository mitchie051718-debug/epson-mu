<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Epson Main Units Sales Portal</title>
<style>
:root{
  --blue:#003399; --blue2:#0046c7; --blue-deep:#001b54; --red:#dd0024;
  --ink:#15233b; --muted:#5b6675; --line:#e3e7ee; --line2:#eef1f6;
  --bg:#ffffff; --soft:#f4f6f9; --soft2:#eef2f7;
  --g-home:#003399; --g-photo:#e6007e; --g-smb:#00a3e0;
  --g-bet:#00833e; --g-wfp:#e2231a; --g-wfe:#6a1b9a;
  --srp:#6b7686; --net:#1f3864; --best:#0b6b3a;
  --shadow:0 1px 3px rgba(16,32,64,.06),0 6px 24px rgba(16,32,64,.06);
  --shadow-h:0 4px 10px rgba(16,32,64,.10),0 18px 48px rgba(0,51,153,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}

.util{background:var(--soft2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.util .wrap{display:flex;justify-content:flex-end;gap:22px;align-items:center;height:34px}
.util a{color:var(--muted);font-weight:500}
.util a:hover{color:var(--blue)}

header.site{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;height:60px;gap:20px}
.brand{display:flex;align-items:center;gap:14px}
.logo-img{height:56px;width:auto;display:block;border-radius:5px}
.htitle{font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.htitle b{color:var(--blue);font-weight:800}
.brand .sub{border-left:1px solid var(--line);padding-left:14px;font-size:16px;line-height:1.22;color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.head .right{display:flex;align-items:center;gap:18px;font-size:13.5px;font-weight:600;color:var(--ink)}
.head .right a{color:var(--ink)}
.head .right a:hover{color:var(--blue)}

.hero{background:linear-gradient(115deg,var(--blue-deep) 0%,var(--blue) 55%,#0a4fd0 100%);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-80px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.14),rgba(255,255,255,0) 60%)}
.hero .wrap{padding:50px 24px 54px;position:relative;z-index:1}
.hero .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:14px}
.hero h1{font-size:clamp(28px,4vw,46px);line-height:1.08;margin:0 0 14px;font-weight:800;max-width:20ch}
.hero p{font-size:clamp(15px,1.5vw,18px);max-width:64ch;margin:0 0 26px;opacity:.94}
.engineered{display:inline-flex;align-items:baseline;gap:7px;font-weight:800;font-size:15px}
.engineered span{font-style:italic;color:#7fd4ff}
.hero .stats{display:flex;gap:38px;margin-top:30px;flex-wrap:wrap}
.hero .stat{display:flex;flex-direction:column;gap:6px}
.hero .stat b{font-size:30px;font-weight:800;line-height:1}
.hero .stat small{font-size:12.5px;opacity:.82;letter-spacing:.05em;text-transform:uppercase;line-height:1.2}

.crumbs{background:var(--soft);border-bottom:1px solid var(--line)}
.crumbs .wrap{display:flex;gap:8px;font-size:12.5px;color:var(--muted);height:42px;align-items:center}
.crumbs a{color:var(--muted)} .crumbs a:hover{color:var(--blue)}
.crumbs .sep{opacity:.5} .crumbs .cur{color:var(--ink);font-weight:600}

/* main category tabs */
.maintabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:66px;z-index:41}
.maintabs .wrap{display:flex;gap:0}
.mtab{flex:0 0 auto;border:0;background:transparent;padding:18px 26px;font-size:15.5px;font-weight:800;color:var(--muted);
  cursor:pointer;border-bottom:3px solid transparent;transition:.15s;letter-spacing:-.01em}
.mtab:hover{color:var(--ink)}
.mtab.on{color:var(--blue);border-bottom-color:var(--blue)}
.mtab .c{font-size:12px;font-weight:700;color:#fff;background:var(--muted);border-radius:999px;padding:1px 9px;margin-left:9px;vertical-align:middle}
.mtab.on .c{background:var(--blue)}
/* pricelist (excel) table */
.plwrap{padding:8px 0 46px}
.plscroll{overflow:auto;max-height:calc(100vh - 160px);border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(16,32,64,.05);margin-bottom:30px}
table.pl{border-collapse:separate;border-spacing:0;font-size:12.5px;white-space:nowrap;min-width:100%}
table.pl th,table.pl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:middle;color:var(--ink)}
table.pl tr>*:first-child{position:sticky;left:0;z-index:2;background:var(--soft);font-weight:600;color:var(--ink);border-right:2px solid var(--line2);min-width:208px;max-width:240px;white-space:normal}
table.pl tr.catrow td{background:#eef3fb;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.03em;font-size:11.5px;text-align:center;border-right:1px solid #d7e2f4}
table.pl tr.catrow th{background:#e3ebf7;color:var(--blue);text-transform:uppercase;font-size:11px;letter-spacing:.03em}
table.pl tr.pricerow td{background:#f3f8ff;font-weight:700;color:var(--blue)}
table.pl tr.pricerow th{background:#eaf2ff;color:var(--blue)}
table.pl tr.modelrow th{position:sticky;top:0;z-index:3;background:#0a3aa0;color:#fff;font-weight:800;border-right-color:rgba(255,255,255,.22);border-bottom:0}
table.pl tr.modelrow th:first-child{position:sticky;left:0;top:0;z-index:4;background:#062b7d;color:#fff;border-right:2px solid rgba(255,255,255,.3)}
table.pl tr:hover td{filter:brightness(.985)}
table.pl .dash{color:var(--muted)}
.mtab .c.xls{background:#0a7d3e;font-size:10.5px;letter-spacing:.04em}
.mtab.on .c.xls{background:#0a7d3e}
/* service centers */
.svcwrap{padding:6px 0 48px}
.svcintro{font-size:13.5px;color:var(--muted);max-width:780px;margin:2px 0 16px;line-height:1.55}
.svccontact{display:flex;flex-wrap:wrap;gap:14px 30px;background:#f3f8ff;border:1px solid #d9e6fb;border-radius:12px;padding:15px 20px;margin-bottom:22px}
.svccontact .ci{font-size:13.5px;color:var(--ink)}
.svccontact .ci .lab{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;display:block;font-weight:800;margin-bottom:2px}
.svccontact .ci a,.svccontact .ci b{color:var(--blue);font-weight:700;text-decoration:none}
.svccontact .ci a:hover{text-decoration:underline}
.svctools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.svcsearch{position:relative;flex:1;min-width:240px;max-width:430px}
.svcsearch input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line2);border-radius:10px;font-size:14px;background:#fff;box-sizing:border-box}
.svcsearch input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,51,153,.10)}
.svcsearch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none}
.svcchips{display:flex;flex-wrap:wrap;gap:8px}
.rchip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.rchip .c{background:var(--soft);color:var(--muted);border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700}
.rchip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.rchip.on .c{background:rgba(255,255,255,.24);color:#fff}
.svccount{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.regionhead{display:flex;align-items:center;gap:12px;margin:24px 0 2px}
.regionhead h2{font-size:16px;font-weight:800;color:var(--ink);margin:0}
.regionhead .ln{flex:1;height:1px;background:var(--line)}
.regionhead .rc{font-size:12px;color:var(--muted);font-weight:600}
.cityhead{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);margin:16px 0 10px}
.svcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(335px,1fr));gap:14px}
.svccard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:15px 16px;box-shadow:0 1px 2px rgba(16,32,64,.04);display:flex;flex-direction:column;gap:7px}
.svccard h3{font-size:14.5px;font-weight:700;color:var(--ink);margin:0;line-height:1.3}
.svccard .addr{font-size:12.5px;color:var(--muted);line-height:1.45}
.svccard .row{display:flex;gap:8px;font-size:12.5px;color:var(--ink);align-items:flex-start;line-height:1.4}
.svccard .row svg{width:14px;height:14px;flex:none;margin-top:2px;stroke:var(--blue);fill:none}
.svccard .prod{font-size:11.5px;color:var(--muted);line-height:1.45;border-top:1px dashed var(--line2);padding-top:8px}
.svccard .dir{margin-top:2px;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--blue);text-decoration:none}
.svccard .dir:hover{text-decoration:underline}
.svccard .dir svg{width:14px;height:14px;stroke:var(--blue);fill:none}
.svcnone{padding:46px;text-align:center;color:var(--muted);font-size:14px}
.mtab .c.svc{background:#e2231a}
.mtab.on .c.svc{background:#e2231a}
.plbar{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin:2px 0 16px}
.plbar .hint{font-size:12.5px;color:var(--muted)}
.dlbtn{display:inline-flex;align-items:center;gap:8px;background:#0a7d3e;color:#fff;border:0;border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(16,32,64,.14)}
.dlbtn:hover{background:#0b8e46}
.dlbtn svg{width:16px;height:16px;stroke:#fff}

/* toolbar */
.toolbar{background:rgba(255,255,255,.95);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);position:sticky;top:127px;z-index:40}
.toolbar .wrap{padding:13px 24px}
.tb-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.search{position:relative;flex:1;min-width:220px;max-width:430px}
.search input{width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;outline:none;transition:.15s;background:#fff}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,51,153,.12)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.fmt{display:flex;gap:4px;background:var(--soft2);border-radius:10px;padding:4px}
.fmt button{border:0;background:transparent;padding:7px 15px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s}
.fmt button.on{background:#fff;color:var(--blue);box-shadow:var(--shadow)}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--blue))}
.chip:hover{border-color:var(--c,var(--blue))}
.chip.on{background:var(--c,var(--blue));border-color:var(--c,var(--blue));color:#fff}
.chip.on .dot{background:#fff}
.count{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:11px}

.catalog{padding:28px 24px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(312px,1fr));gap:22px}
.divider{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin:16px 0 2px}
.divider:first-child{margin-top:0}
.divider .bar{width:5px;height:26px;border-radius:3px;background:var(--c,var(--blue))}
.divider h2{font-size:18px;margin:0;font-weight:800}
.divider .ln{flex:1;height:1px;background:var(--line)}
.divider .n{font-size:12px;color:var(--muted);font-weight:600}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
  transition:.2s;box-shadow:var(--shadow);position:relative}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-2px);border-color:#d4dbe6}
.card .accent{height:4px;background:var(--c,var(--blue))}
.thumb{background:#fff;padding:18px;display:flex;align-items:center;justify-content:center;height:160px;border-bottom:1px solid var(--line2)}
.thumb svg{height:118px;width:auto}
.thumb .pimg{max-height:142px;max-width:92%;width:auto;height:auto;object-fit:contain}
.badge{position:absolute;top:13px;right:14px;background:var(--g-photo);color:#fff;font-size:10.5px;font-weight:800;
  letter-spacing:.08em;padding:4px 9px;border-radius:5px;text-transform:uppercase;z-index:2}
.body{padding:18px;display:flex;flex-direction:column;flex:1}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c,var(--blue));margin-bottom:6px}
.model{font-size:21px;font-weight:800;margin:0 0 4px;letter-spacing:-.015em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.fmtbadge{font-size:11px;font-weight:700;color:var(--c,var(--blue));border:1.5px solid var(--c,var(--blue));border-radius:6px;padding:1px 7px}
.typeline{font-size:12.5px;color:var(--muted);margin-bottom:14px}

.prices{display:grid;gap:8px;margin-bottom:14px;grid-template-columns:repeat(2,1fr)}
.prices.three{grid-template-columns:repeat(3,1fr)}
.pc{border:1px solid var(--line);border-radius:9px;padding:8px 9px;text-align:center;background:#fff}
.pc .pl{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:3px;white-space:nowrap}
.pc .pv{font-size:14.5px;font-weight:800;color:var(--net);letter-spacing:-.01em;white-space:nowrap}
.pc.srp{background:var(--soft)}
.pc.srp .pv{color:var(--srp);font-weight:700}
.pc.best{background:#e7f4ec;border-color:#bfe3cd}
.pc.best .pv{color:var(--best)}

.keyspecs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}
.ks{background:var(--soft);border-radius:8px;padding:7px 10px}
.ks .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-bottom:2px}
.ks .v{font-size:12px;font-weight:700;line-height:1.25}
.desc{font-size:13px;color:#3c4759;line-height:1.55}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more-full{display:none;margin-top:10px}
.card.open .more-full{display:block;animation:fade .25s ease}
.card.open .desc.clamp{-webkit-line-clamp:unset;display:block}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.spectable{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
.spectable tr{border-bottom:1px solid var(--line2)} .spectable tr:last-child{border-bottom:0}
.spectable th{text-align:left;font-weight:600;color:var(--muted);padding:7px 8px 7px 0;width:48%;vertical-align:top;font-size:11.5px}
.spectable td{padding:7px 0;font-weight:600;vertical-align:top}
.foot{margin-top:auto;padding-top:14px;display:flex;justify-content:flex-end}
.readmore{border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;font-size:13px;
  padding:9px 16px;border-radius:9px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.readmore:hover{background:var(--blue);color:#fff}
.card.open .readmore svg{transform:rotate(180deg)}
.readmore svg{transition:.2s}

.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}

footer.site{background:var(--blue-deep);color:#cdd7ee;margin-top:10px}
.fmain{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px;padding:46px 24px 32px}
.fmain h4{color:#fff;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 16px}
.fmain a{color:#b9c6e6;display:block;padding:5px 0;font-size:13.5px} .fmain a:hover{color:#fff}
.flogo{font-family:Arial;font-weight:900;font-size:26px;color:#fff;letter-spacing:1px;margin-bottom:10px}
.fmain .blurb{font-size:13px;line-height:1.6;color:#aab9dc;max-width:36ch}
.fmain .eng{margin-top:16px;font-weight:800;font-size:14px;color:#fff}
.fmain .eng span{font-style:italic;color:#7fd4ff}
.fbar{border-top:1px solid rgba(255,255,255,.12);padding:18px 24px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:12px;color:#9fb0d6}
.fbar a{color:#9fb0d6}

@media(max-width:900px){.fmain{grid-template-columns:1fr 1fr}}
@media(max-width:560px){
  .util{display:none}
  .maintabs{top:66px}.toolbar{top:121px}
  .mtab{padding:15px 16px;font-size:14px}
  .prices.three{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .pc .pv{font-size:13px}
  .fmain{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* intro key visual */
#kvsplash{position:fixed;inset:0;z-index:9999;background:radial-gradient(120% 90% at 50% 25%,#ffffff 0%,#eef4fc 55%,#dbe8fa 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:1;transition:opacity .55s ease}
#kvsplash.gone{opacity:0;pointer-events:none}
.kv-bar{position:absolute;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,var(--blue),#3a78e0);z-index:3}
.kv-skip{position:absolute;top:18px;right:20px;background:rgba(255,255,255,.85);border:1px solid var(--line2);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;z-index:4}
.kv-skip:hover{background:#fff}
.kv-brand{position:absolute;top:18px;left:24px;font-size:15px;font-weight:800;color:var(--muted);letter-spacing:.01em;z-index:4}
.kv-brand b{color:var(--blue)}
.kv-stage{position:relative;width:min(700px,92vw);height:min(580px,80vh)}
.kv-slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:7px;opacity:0;transform:translateY(16px) scale(.98);transition:opacity .6s ease,transform .6s ease;pointer-events:none}
.kv-slide.active{opacity:1;transform:none;pointer-events:auto}
.kv-ribbon{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(90deg,#e2231a,#ff5b3d);color:#fff;font-weight:800;font-size:15px;letter-spacing:.07em;padding:10px 22px;border-radius:999px;box-shadow:0 8px 22px rgba(226,35,26,.30);text-transform:uppercase}
.kv-ribbon svg{width:17px;height:17px;fill:#ffd34d;stroke:none}
.kv-img{height:min(290px,38vh);display:flex;align-items:center;justify-content:center;margin:8px 0 2px}
.kv-img img{max-height:100%;max-width:92%;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(16,32,64,.14))}
.kv-new{display:inline-block;background:var(--blue);color:#fff;font-size:11px;font-weight:800;letter-spacing:.10em;padding:3px 11px;border-radius:6px}
.kv-model{font-size:clamp(26px,4.4vw,36px);font-weight:800;color:var(--ink);margin:1px 0 0;line-height:1.1}
.kv-sub{font-size:14.5px;color:var(--muted)}
.kv-mbox{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:9px;font-size:13px;color:var(--ink);font-weight:600}
.kv-mbox span{display:inline-flex;align-items:center;gap:7px}
.kv-mbox svg{width:16px;height:16px;stroke:#0a7d3e;fill:none;stroke-width:2.6}
.kv-dots{display:flex;gap:9px;margin-top:14px;align-items:center;z-index:4}
.kv-dot{width:9px;height:9px;border-radius:50%;background:#c3d4ec;cursor:pointer;transition:all .35s}
.kv-dot.on{background:var(--blue);width:26px;border-radius:6px}
@media(max-width:520px){.kv-ribbon{font-size:12.5px;padding:8px 15px}.kv-mbox{gap:12px;font-size:12px}}
/* one-page intro overrides */
.kv-dots{display:none}
.kv-stage{width:min(1060px,94vw);height:auto;max-height:88vh}
.kv-onepage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;opacity:0;transform:translateY(16px) scale(.985);transition:opacity .6s ease,transform .6s ease}
.kv-onepage.in{opacity:1;transform:none}
.kv-h1{font-size:clamp(24px,3.6vw,38px);font-weight:800;color:var(--ink);margin:6px 0 0;line-height:1.1}
.kv-grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;width:100%;margin-top:8px}
.kv-tile{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 10px 13px;display:flex;flex-direction:column;align-items:center;gap:9px;box-shadow:0 6px 16px rgba(16,32,64,.07)}
.kv-tnew{position:absolute;top:8px;left:8px;background:var(--blue);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:5px}
.kv-timg{height:118px;display:flex;align-items:center;justify-content:center}
.kv-timg img{max-height:100%;max-width:100%;object-fit:contain}
.kv-tname{font-size:13.5px;font-weight:700;color:var(--ink)}
.kv-foot{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;margin:10px 0 0;font-size:13.5px;color:var(--ink);font-weight:600}
.kv-foot span{display:inline-flex;align-items:center;gap:7px}
.kv-foot svg{width:16px;height:16px;stroke:#0a7d3e;fill:none;stroke-width:2.6}
@media(max-width:880px){.kv-grid5{grid-template-columns:repeat(2,1fr)}.kv-timg{height:104px}}
@media(max-width:520px){.kv-ribbon{font-size:12.5px;padding:8px 15px}.kv-foot{gap:12px;font-size:12px}}

function downloadXlsx(){const bin=atob(XLSX_B64),n=bin.length,a8=new Uint8Array(n);for(let i=0;i<n;i++)a8[i]=bin.charCodeAt(i);const blob=new Blob([a8],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="Epson_Main_Units_Pricelist.xlsx";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}const GROUPS = {
  "For Home Users and Students":{label:"Home & Students",color:"var(--g-home)"},
  "For Photo Enthusiasts":{label:"Photo",color:"var(--g-photo)"},
  "For Small Businesses and Home Offices":{label:"Small Business",color:"var(--g-smb)"},
  "Business EcoTank Printer":{label:"Business EcoTank",color:"var(--g-bet)"},
  "Workforce Pro — Replaceable Ink Pack System":{label:"WorkForce Pro",color:"var(--g-wfp)"},
  "Workforce Enterprise — Linehead Inkjet":{label:"WorkForce Enterprise",color:"var(--g-wfe)"},
};
const groupOrder = Object.keys(GROUPS);
function catGroups(cat){ return groupOrder.filter(g=>PRODUCTS.some(p=>p.cat===cat && p.group===g)); }

let activeCat="EcoTank", activeGroup="all", activeFmt="all", query="";

/* main tabs */
const mt=document.getElementById('maintabs');
function buildMainTabs(){
  mt.innerHTML="";
  CATS.forEach(c=>{
    const n=PRODUCTS.filter(p=>p.cat===c).length;
    const b=document.createElement('button');
    b.className='mtab'+(c===activeCat?' on':''); b.dataset.cat=c;
    b.innerHTML=`${CATLABEL[c]}`;
    mt.appendChild(b);
  });
  const pb=document.createElement('button');
  pb.className='mtab'+("Pricelist"===activeCat?' on':''); pb.dataset.cat="Pricelist";
  pb.innerHTML=`Pricelist<span class="c xls">XLS</span>`;
  mt.appendChild(pb);
  const sb=document.createElement('button');
  sb.className='mtab'+("Service"===activeCat?' on':''); sb.dataset.cat="Service";
  sb.innerHTML=`Service Centers`;
  mt.appendChild(sb);
}
mt.addEventListener('click',e=>{
  const b=e.target.closest('.mtab'); if(!b)return;
  activeCat=b.dataset.cat; activeGroup="all";
  buildMainTabs(); applyView();
  window.scrollTo({top:document.querySelector('.maintabs').offsetTop-66,behavior:'smooth'});
});

/* sub chips */
const chipsEl=document.getElementById('chips');
function buildChips(){
  chipsEl.innerHTML="";
  const all=document.createElement('button');
  all.className='chip'+(activeGroup==="all"?' on':''); all.dataset.g='all';
  all.innerHTML='<span class="dot" style="background:var(--ink)"></span>All '+CATLABEL[activeCat];
  chipsEl.appendChild(all);
  catGroups(activeCat).forEach(g=>{
    const meta=GROUPS[g];
    const b=document.createElement('button');
    b.className='chip'+(activeGroup===g?' on':''); b.dataset.g=g; b.style.setProperty('--c',meta.color);
    b.innerHTML=`<span class="dot"></span>${meta.label}`;
    chipsEl.appendChild(b);
  });
}
chipsEl.addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b)return;
  activeGroup=b.dataset.g;
  [...chipsEl.children].forEach(c=>c.classList.toggle('on',c===b));
  render();
});
document.getElementById('fmt').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  activeFmt=b.dataset.f;
  [...e.currentTarget.children].forEach(c=>c.classList.toggle('on',c===b));

/* helpers */
const peso=n=> (n||n===0) ? '₱'+Number(n).toLocaleString('en-PH') : '—';
function keySpecs(p){
  const s=p.specs;
  const pick=(...k)=>{for(const x of k){if(s[x])return s[x];}return "";};
  const out=[];
  const speed=pick("ISO 24734 Simplex A4 (Black / Color)","A4 Simplex ISO Print Speed (Black / Color)","Draft Print Speed A4 (Black / Color)");
  const yld=pick("Page Yield (Black / Color)","A4 Page Yield ISO/IEC 24734 (Black / Color)");
  const ink=pick("Ink Model"), paper=pick("Paper Handling"), warr=pick("Warranty");
  if(speed)out.push(["Print speed",speed]);
  if(yld)out.push(["Page yield",yld]);
  if(ink)out.push(["Ink",ink]); else if(paper)out.push(["Paper",paper]);
  if(warr)out.push(["Warranty",warr]); else if(paper&&ink)out.push(["Paper",paper]);
  return out.slice(0,4);
}
function priceBlock(p){
  const three=p.prices.length===3;
  const cells=p.prices.map((pr,i)=>{
    const [label,val]=pr;
    let cls="pc";
    if(label==="SRP")cls+=" srp";
    else if(i===p.prices.length-1)cls+=" best";
    return `<div class="${cls}"><div class="pl">${label}</div><div class="pv">${peso(val)}</div></div>`;
  }).join("");
  return `<div class="prices${three?' three':''}">${cells}</div>`;
}
function specRows(p){return Object.entries(p.specs).map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join("");}

function svgType(p){
  const m=(p.model||'').toUpperCase();
  if(p.group==="Workforce Enterprise — Linehead Inkjet" || ["WF-C20750","WF-C21000","WF-M21000"].includes(m)) return "enterprise";
  if(["L8050","L8100","L18050"].includes(m)) return "photo";
  if(p.format && p.format.indexOf("A3")===0) return "wide";
  if(/scan/i.test(p.type||"")) return "mfp";
  return "single";
}

function card(p){
  const meta=GROUPS[p.group]; const c=meta.color;
  const ks=keySpecs(p).map(([l,v])=>`<div class="ks"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");
  const badge=p.isNew?'<span class="badge">New</span>':'';
  return `<article class="card" style="--c:${c}">
    <div class="accent"></div>${badge}
    <div class="thumb">${MODEL_IMG[p.model]?`<img class="pimg" src="${MODEL_IMG[p.model]}" alt="Epson ${p.model}" loading="lazy">`:printerSVG(svgType(p),c)}</div>
    <div class="body">
      <div class="eyebrow">${meta.label}</div>
      <h3 class="model">Epson ${p.model}<span class="fmtbadge">${p.format}</span></h3>
      <div class="typeline">${p.type}</div>
      ${priceBlock(p)}
      <div class="keyspecs">${ks}</div>
      <p class="desc clamp">${p.short}</p>
      <div class="more-full">
        <p class="desc" style="margin:4px 0 0">${p.long}</p>
        <table class="spectable">${specRows(p)}</table>
      </div>
      <div class="foot">
        <button class="readmore" aria-expanded="false">
          <span class="lbl">Read more</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
    </div>
  </article>`;
}

function renderPricelist(){
  let html='<div class="wrap plwrap"><div class="plbar"><span class="hint">Full Epson main-units pricelist</span><button class="dlbtn" onclick="downloadXlsx()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>Download Excel (.xlsx)</button></div>';
  PRICELIST.forEach(sh=>{
    html+=`<div class="divider" style="--c:var(--blue)"><span class="bar"></span><h2>${sh.title}</h2><span class="ln"></span><span class="n">${sh.n} models</span></div>`;
    html+='<div class="plscroll"><table class="pl">';
    sh.rows.forEach(r=>{
      if(r.type==='cat'){
        html+=`<tr class="catrow"><th>${r.label}</th>`+r.cells.map(c=>`<td colspan="${c.span}">${c.text||''}</td>`).join('')+'</tr>';
      } else if(r.type==='model'){
        html+=`<tr class="modelrow"><th>${r.label}</th>`+r.cells.map(m=>`<th>${m}</th>`).join('')+'</tr>';
      } else {
        const cls=r.type==='price'?' class="pricerow"':'';
        html+=`<tr${cls}><th>${r.label}</th>`+r.cells.map(v=>`<td>${(v===''||v==null)?'<span class=\'dash\'>–</span>':v}</td>`).join('')+'</tr>';
      }
    });
    html+='</table></div>';
  });
  plEl.innerHTML=html+'</div>';
}

const SUPPORT = {"email": "customercare@epc.epson.com.ph", "tollfree": "1-800-1069-37766 (PLDT)", "manila": "(02) 8441-9030"};
const svcEl=document.getElementById('servicecenters');
const REGION_ORDER=["Metro Manila","Luzon","Visayas","Mindanao"];
let svcState={q:"",region:"All"}, svcBuilt=false;
function svcCount(r){ return r==="All"?SERVICE.length:SERVICE.filter(s=>s.region===r).length; }
function renderService(){
  if(!svcBuilt){
    const chips=["All",...REGION_ORDER].map(r=>`<button class="rchip${r===svcState.region?' on':''}" data-region="${r}">${r==="All"?"All Regions":r}<span class="c">${svcCount(r)}</span></button>`).join("");
    svcEl.innerHTML=`<div class="wrap svcwrap">
      <div class="svcintro">Epson is dedicated to providing prompt, efficient and courteous service. Find your nearest authorized Epson service center below.</div>
      <div class="svccontact">
        <div class="ci"><span class="lab">Toll Free</span><b>${SUPPORT.tollfree}</b></div>
        <div class="ci"><span class="lab">Metro Manila</span><a href="tel:+6328441903">${SUPPORT.manila}</a></div>
        <div class="ci"><span class="lab">Email Support</span><a href="mailto:${SUPPORT.email}">${SUPPORT.email}</a></div>
      </div>
      <div class="svctools">
        <div class="svcsearch"><svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg> <input id="svcq" type="text" placeholder="Search by name, city, address, or product…" autocomplete="off"></div>
        <div class="svcchips" id="svcchips">${chips}</div>
      </div>
      <div class="svccount" id="svccount"></div>
      <div id="svcresults"></div>
    </div>`;
    svcEl.querySelector('#svcq').addEventListener('input',e=>{ svcState.q=e.target.value.trim().toLowerCase(); renderServiceResults(); });
    svcEl.querySelector('#svcchips').addEventListener('click',e=>{ const b=e.target.closest('.rchip'); if(!b)return; svcState.region=b.dataset.region; svcEl.querySelectorAll('.rchip').forEach(x=>x.classList.toggle('on',x.dataset.region===svcState.region)); renderServiceResults(); });
    svcBuilt=true;
  }
  renderServiceResults();
}
function dirLink(c){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(c.name+", "+c.address); }
function svcCard(c){
  return `<div class="svccard">
    <h3>${c.name}</h3>
    <div class="addr">${c.address}</div>
    <div class="row"><svg viewBox="0 0 24 24" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>${c.phone}</span></div>
    <div class="row"><svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>${c.hours}</span></div>
    <div class="prod">${c.products}</div>
    <a class="dir" href="${dirLink(c)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Get directions</a>
  </div>`;
}
function renderServiceResults(){
  const q=svcState.q;
  let list=SERVICE.filter(c=> svcState.region==="All"||c.region===svcState.region);
  if(q) list=list.filter(c=> (c.name+" "+c.city+" "+c.address+" "+c.products+" "+c.region).toLowerCase().includes(q));
  const cEl=svcEl.querySelector('#svccount'); const rEl=svcEl.querySelector('#svcresults');
  cEl.textContent = list.length+" service center"+(list.length===1?"":"s")+(svcState.region==="All"?" nationwide":" in "+svcState.region)+(q?` matching “${svcState.q}”`:"");
  if(!list.length){ rEl.innerHTML='<div class="svcnone">No service centers match your search. Try a different keyword or region.</div>'; return; }
  let html="";
  REGION_ORDER.forEach(reg=>{
    const inReg=list.filter(c=>c.region===reg); if(!inReg.length)return;
    html+=`<div class="regionhead"><h2>${reg}</h2><span class="ln"></span><span class="rc">${inReg.length} center${inReg.length===1?"":"s"}</span></div>`;
    const cities=[...new Set(inReg.map(c=>c.city))];
    cities.forEach(city=>{
      html+=`<div class="cityhead">${city}</div><div class="svcgrid">`;
      html+=inReg.filter(c=>c.city===city).map(svcCard).join("");
      html+=`</div>`;
    });
  });
  rEl.innerHTML=html;
}

function applyView(){
  const pl = activeCat==='Pricelist', sv = activeCat==='Service';
  toolbarEl.style.display = (pl||sv)?'none':'';
  catalogEl.style.display = (pl||sv)?'none':'';
  plEl.style.display = pl?'':'none';
  svcEl.style.display = sv?'':'none';
  if(pl){ renderPricelist(); }
  else if(sv){ renderService(); }
  else { buildChips(); render(); }
}
function matchFmt(p){ if(activeFmt==="all")return true; return activeFmt==="A4"?p.format==="A4":p.format.startsWith("A3"); }
function matchQ(p){ if(!query)return true; return (p.model+" "+p.type+" "+p.group+" "+p.long).toLowerCase().includes(query); }

function render(){
  const list=PRODUCTS.filter(p=>p.cat===activeCat && (activeGroup==="all"||p.group===activeGroup) && matchFmt(p) && matchQ(p));
  countEl.textContent=`Showing ${list.length} ${CATLABEL[activeCat]}${activeGroup==="all"?"":" · "+GROUPS[activeGroup].label}`;
  if(!list.length){ grid.innerHTML=`<div class="empty"><b>No printers match your filters</b>Try clearing the search or choosing “All”.</div>`; return; }
  let html="";
  catGroups(activeCat).filter(g=>list.some(p=>p.group===g)).forEach(gk=>{
    const meta=GROUPS[gk]; const items=list.filter(p=>p.group===gk);
    html+=`<div class="divider" style="--c:${meta.color}"><span class="bar"></span><h2>${meta.label}</h2><span class="ln"></span><span class="n">${items.length} model${items.length>1?'s':''}</span></div>`;
    html+=items.map(card).join("");
  });
  grid.innerHTML=html;
}
grid.addEventListener('click',e=>{
  const btn=e.target.closest('.readmore'); if(!btn)return;
  const card=btn.closest('.card'); const open=card.classList.toggle('open');
  btn.setAttribute('aria-expanded',open);
  btn.querySelector('.lbl').textContent=open?"Read less":"Read more";
});

const _st=document.getElementById('st-total'); if(_st)_st.textContent=PRODUCTS.length;
buildMainTabs(); applyView();

/* ---- intro key-visual (one page, all new models) ---- */
(function(){
  const KV=[
    {k:"L1310",        name:"L1310"},
    {k:"L1350",        name:"L1350"},
    {k:"L3310/ L3316", name:"L3310 / L3316"},
    {k:"L3350/ L3356", name:"L3350 / L3356"},
    {k:"L5390",        name:"L5390"}
  ];
  const sp=document.getElementById('kvsplash'); if(!sp) return;
  const stage=document.getElementById('kvStage'), bar=document.getElementById('kvBar');
  const star='<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3L22 9.3l-5 4.7 1.3 6.9L12 17.8 5.7 20.9 7 14 2 9.3l7.1-1z"/></svg>';
  const chk='<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
  const tiles=KV.map(m=>`<div class="kv-tile"><span class="kv-tnew">NEW</span><div class="kv-timg"><img src="${MODEL_IMG[m.k]||''}" alt="Epson ${m.name}"></div><div class="kv-tname">Epson ${m.name}</div></div>`).join("");
  stage.innerHTML=`<div class="kv-onepage">
      <div class="kv-ribbon">${star} Now with Maintenance Box</div>
      <h1 class="kv-h1">5 New Epson EcoTank Models</h1>
      <div class="kv-grid5">${tiles}</div>
      <p class="kv-foot"><span>${chk} Mess-free ink maintenance</span><span>${chk} Easy DIY replacement</span></p>
    </div>`;
  const DUR=6500;
  bar.style.transition='none'; bar.style.width='0%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ bar.style.transition='width '+DUR+'ms linear'; bar.style.width='100%'; }));
  requestAnimationFrame(()=>sp.querySelector('.kv-onepage').classList.add('in'));
  let t=setTimeout(dismiss, DUR);
  function dismiss(){ clearTimeout(t); sp.classList.add('gone'); setTimeout(()=>{ if(sp&&sp.parentNode) sp.remove(); },650); }
  document.getElementById('kvSkip').addEventListener('click',dismiss);
  sp.addEventListener('click',e=>{ if(e.target===sp) dismiss(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') dismiss(); });
})();
</script>
